# user-web nginx (behind a reverse proxy). __API_SECRET__, __DASH_TOKEN__ and __DASH_BASIC__ are filled in at
# build time from ~/.jobhunt.json.

# Private dashboard login (2026-10-14): the PIN screen (/pin.html -> /api/login) sets cookie jh_pin = dash_token.
# Scripts on my PC still send the old "Authorization: Basic user:<dash_password>" header,
# which is accepted too.
map_hash_bucket_size 128; # the 48-char token is longer than the default bucket allows
map $cookie_jh_pin $jh_cookie_ok { "__DASH_TOKEN__" 1; default 0; }
map $http_authorization $jh_basic_ok { "Basic __DASH_BASIC__" 1; default 0; }
map "$jh_cookie_ok$jh_basic_ok" $jh_ok { "00" 0; default 1; }

server {
  listen 80;
  server_name jobs.example.com;
  root /usr/share/nginx/jobs;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "no-store" always;

  # Resolve n8n per request so nginx starts even while n8n restarts.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $n8n http://n8n_n8n:5678;

  # Open without the cookie, but n8n only lets it try a PIN (X-Jobhunt-Login).
  location = /api/login {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass $n8n/webhook/jobhunt-api;
    proxy_set_header X-Jobhunt-Key "__API_SECRET__";
    proxy_set_header X-Jobhunt-Login "1";
    proxy_set_header Content-Type application/json;
    proxy_set_header Authorization "";
    proxy_read_timeout 30s;
  }

  location = /api/jobhunt {
    if ($jh_ok = 0) { return 401; }
    limit_except POST { deny all; }
    client_max_body_size 1m;
    proxy_pass $n8n/webhook/jobhunt-api;
    proxy_set_header X-Jobhunt-Key "__API_SECRET__";
    proxy_set_header Content-Type application/json;
    proxy_set_header Authorization "";
    proxy_read_timeout 120s;
  }

  # Phone app (Add to Home Screen): this nginx's mime.types doesn't know .webmanifest.
  location = /manifest.webmanifest { default_type application/manifest+json; }
  # Icons + PIN page stay open so the home-screen icon and the login screen load before the PIN is entered.
  location ~ ^/(icon[\w-]*\.(png|svg)|pin\.html)$ { }

  location / {
    if ($jh_ok = 0) { rewrite ^ /pin.html last; }
    try_files $uri /index.html;
  }
}

# Portfolio AI chat (2026-10-16): Traefik sends the visitor's IP as X-Real-Ip. nginx caps bursts per IP, n8n
# "JobHunt / Portfolio Chat" caps per chat / IP / day (db/011).
map $http_x_real_ip $chat_ip { "" $remote_addr; default $http_x_real_ip; }
limit_req_zone $chat_ip zone=portfolio_chat:1m rate=10r/m;

# Public portfolio + resumes (n8n "JobHunt / Send" downloads the resume PDFs from here).
server {
  listen 80 default_server;
  server_name portfolio.example.com _;
  root /usr/share/nginx/portfolio;
  index index.html;

  add_header X-Content-Type-Options nosniff always;

  resolver 127.0.0.11 valid=30s ipv6=off;
  set $n8n http://n8n_n8n:5678;

  location = /api/chat {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    limit_req zone=portfolio_chat burst=5 nodelay;
    limit_req_status 429;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_pass $n8n/webhook/jobhunt-portfolio-chat;
    proxy_set_header X-Jobhunt-Key "__API_SECRET__";
    proxy_set_header X-Chat-Ip $chat_ip;
    proxy_set_header Content-Type application/json;
    proxy_set_header Authorization "";
    proxy_read_timeout 60s;
  }

  location /resume/ { add_header Cache-Control "no-cache" always; }
  location /media/ { expires 7d; add_header Cache-Control "public" always; }
  # no-cache: browsers re-check the page each visit (ETag), so edits show up right away (2026-10-16)
  location / { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; try_files $uri $uri/ /index.html; }
}
